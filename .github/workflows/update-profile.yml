name: Update GitHub profile SVG

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-svg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and push statistics against latest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_BRANCH: ${{ github.ref_name }}
        run: bash scripts/refresh_profile.sh
