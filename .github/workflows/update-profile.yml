name: Update GitHub profile SVG

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-svg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update live statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py --include-pending-commit
      - name: Commit and push only when changed
        run: |
          if git diff --quiet -- parasite6.svg; then
            echo 'No changes; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parasite6.svg
          git commit -m 'chore: update GitHub profile statistics'
          git push
